<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="0.5" stop-color="#4a3120"/>
      <stop offset="1" stop-color="#2c1c12"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d78a"/>
      <stop offset="0.5" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
  </defs>

  <!-- outer wood ring -->
  <rect x="2" y="2" width="44" height="44" fill="none" stroke="url(#wood)" stroke-width="7"/>
  <!-- thin brass inlay just inside the wood -->
  <rect x="5" y="5" width="38" height="38" fill="none" stroke="url(#brass)" stroke-width="1.4" opacity="0.85"/>
  <!-- thin dark inner lip -->
  <rect x="7.2" y="7.2" width="33.6" height="33.6" fill="none" stroke="#1a1109" stroke-width="1"/>

  <!-- corner rivets -->
  <g stroke="#1a1109" stroke-width="1">
    <circle cx="8" cy="8" r="3.1" fill="url(#brass)"/>
    <circle cx="40" cy="8" r="3.1" fill="url(#brass)"/>
    <circle cx="8" cy="40" r="3.1" fill="url(#brass)"/>
    <circle cx="40" cy="40" r="3.1" fill="url(#brass)"/>
  </g>
  <g fill="#fff3cf" opacity="0.55">
    <circle cx="7" cy="7" r="0.8"/>
    <circle cx="39" cy="7" r="0.8"/>
    <circle cx="7" cy="39" r="0.8"/>
    <circle cx="39" cy="39" r="0.8"/>
  </g>

  <!-- small corner leaf accents -->
  <g fill="none" stroke="url(#brass)" stroke-width="1.2" stroke-linecap="round">
    <path d="M12 5.5 Q16 5.5 16 9.5"/>
    <path d="M36 5.5 Q32 5.5 32 9.5"/>
    <path d="M12 42.5 Q16 42.5 16 38.5"/>
    <path d="M36 42.5 Q32 42.5 32 38.5"/>
  </g>
</svg>
